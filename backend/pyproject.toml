[project]
name = "procurement-assistant"
version = "0.1.0"
description = "采购智能助手轻量版后端"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi<1",
    "uvicorn[standard]<1",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "langgraph>=1,<2",
    "langgraph-checkpoint-postgres>=3,<4",
    "langchain>=1,<2",
    "langchain-core>=1,<2",
    "langchain-openai>=1,<2",
    "ag-ui-protocol",
    "httpx<1",
    "psycopg[binary,pool]>=3,<4",
    "tenacity>=9,<10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/procurement_assistant"]

[tool.hatch.build.targets.wheel.force-include]
"src/procurement_assistant/business/prompts/memory_update.md" = "procurement_assistant/business/prompts/memory_update.md"
"src/procurement_assistant/business/prompts/product_search_terms.md" = "procurement_assistant/business/prompts/product_search_terms.md"
"src/procurement_assistant/business/prompts/purchase_field_extraction.md" = "procurement_assistant/business/prompts/purchase_field_extraction.md"
"src/procurement_assistant/business/prompts/scenario_router.md" = "procurement_assistant/business/prompts/scenario_router.md"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "../test_support", "../tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["../tests"]
pythonpath = ["src", ".."]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
